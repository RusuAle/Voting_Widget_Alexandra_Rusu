<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8"/>
    <title>Vote Now</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800;900&display=swap');
        * { margin:0; padding:0; box-sizing:border-box; }

        body {
            font-family: 'Inter', sans-serif;
            background: #0a0a1a;
            min-height: 100vh;
            color: #fff;
            overflow-x: hidden;
        }

        /* Animated background */
        .bg {
            position: fixed; inset: 0; z-index: 0;
            background: radial-gradient(ellipse at 20% 50%, #1a0533 0%, transparent 60%),
                        radial-gradient(ellipse at 80% 20%, #001a3a 0%, transparent 60%),
                        radial-gradient(ellipse at 60% 80%, #0d1f0d 0%, transparent 60%),
                        #0a0a1a;
        }

        .particles { position: fixed; inset: 0; z-index: 0; overflow: hidden; }
        .particle {
            position: absolute;
            border-radius: 50%;
            animation: rise linear infinite;
            opacity: 0;
        }
        @keyframes rise {
            0% { transform: translateY(100vh) scale(0); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 0.6; }
            100% { transform: translateY(-10vh) scale(1); opacity: 0; }
        }

        .grid-lines {
            position: fixed; inset: 0; z-index: 0;
            background-image:
                linear-gradient(rgba(108,99,255,0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(108,99,255,0.03) 1px, transparent 1px);
            background-size: 60px 60px;
        }

        .page {
            position: relative; z-index: 1;
            max-width: 620px; margin: 0 auto;
            padding: 2.5rem 1.2rem 3rem;
        }

        /* Header */
        .header { text-align: center; margin-bottom: 3rem; }

        .logo-wrap {
            display: inline-flex; align-items: center; gap: 0.75rem;
            margin-bottom: 1rem;
        }

        .logo-icon {
            width: 52px; height: 52px; border-radius: 16px;
            background: linear-gradient(135deg, #6C63FF, #FF6584);
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 0 30px rgba(108,99,255,0.5);
            animation: glow 3s ease-in-out infinite;
        }
        @keyframes glow {
            0%,100% { box-shadow: 0 0 30px rgba(108,99,255,0.5); }
            50% { box-shadow: 0 0 50px rgba(255,101,132,0.7), 0 0 80px rgba(108,99,255,0.3); }
        }
        .logo-icon svg { width: 28px; height: 28px; fill: white; }

        .logo-text {
            font-size: 2rem; font-weight: 900; letter-spacing: -1px;
            background: linear-gradient(90deg, #a78bfa, #f472b6, #34d399);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            background-size: 200%; animation: gradient-shift 4s ease infinite;
        }
        @keyframes gradient-shift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .subtitle {
            font-size: 0.9rem; color: rgba(255,255,255,0.4);
            letter-spacing: 0.5px;
        }

        .divider {
            height: 1px; margin: 2rem 0 1.5rem;
            background: linear-gradient(90deg, transparent, rgba(108,99,255,0.4), rgba(255,101,132,0.4), transparent);
        }

        .section-label {
            font-size: 0.68rem; font-weight: 700; letter-spacing: 2.5px;
            text-transform: uppercase;
            background: linear-gradient(90deg, #a78bfa, #f472b6);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            margin-bottom: 1.2rem;
        }

        /* Poll cards */
        .polls-list { display: flex; flex-direction: column; gap: 0.85rem; }

        .poll-card {
            position: relative; overflow: hidden;
            border-radius: 20px; padding: 1.3rem 1.5rem;
            text-decoration: none; color: #fff;
            display: flex; align-items: center; justify-content: space-between; gap: 1rem;
            border: 1px solid rgba(255,255,255,0.08);
            background: rgba(255,255,255,0.04);
            backdrop-filter: blur(20px);
            transition: all 0.4s cubic-bezier(0.4,0,0.2,1);
            animation: card-in 0.5s ease both;
        }
        @keyframes card-in {
            from { opacity:0; transform: translateX(-20px); }
            to { opacity:1; transform: translateX(0); }
        }

        /* Shimmer effect */
        .poll-card::before {
            content: '';
            position: absolute; inset: 0;
            background: linear-gradient(105deg, transparent 40%, rgba(255,255,255,0.04) 50%, transparent 60%);
            transform: translateX(-100%);
            transition: transform 0.6s ease;
        }
        .poll-card.can-vote:hover::before { transform: translateX(100%); }

        /* Left accent bar */
        .poll-card::after {
            content: '';
            position: absolute; left: 0; top: 15%; bottom: 15%;
            width: 3px; border-radius: 0 3px 3px 0;
            background: linear-gradient(180deg, #6C63FF, #FF6584);
            opacity: 0; transition: opacity 0.3s ease;
        }
        .poll-card.can-vote:hover::after { opacity: 1; }

        .poll-card.can-vote {
            cursor: pointer;
        }
        .poll-card.can-vote:hover {
            background: rgba(108,99,255,0.12);
            border-color: rgba(108,99,255,0.4);
            transform: translateX(6px) scale(1.01);
            box-shadow: 0 10px 40px rgba(108,99,255,0.2), 0 0 0 1px rgba(108,99,255,0.2);
        }

        .poll-card.voted {
            border-color: rgba(52,211,153,0.2);
            background: rgba(52,211,153,0.04);
            cursor: default; opacity: 0.75;
        }
        .poll-card.voted::after {
            background: linear-gradient(180deg, #34d399, #059669);
            opacity: 1;
        }

        .poll-left { display: flex; align-items: center; gap: 1rem; flex: 1; min-width: 0; }

        .poll-indicator {
            width: 44px; height: 44px; border-radius: 12px; flex-shrink: 0;
            display: flex; align-items: center; justify-content: center;
            position: relative;
        }
        .poll-indicator.active {
            background: linear-gradient(135deg, rgba(108,99,255,0.3), rgba(255,101,132,0.2));
            border: 1px solid rgba(108,99,255,0.4);
        }
        .poll-indicator.done {
            background: linear-gradient(135deg, rgba(52,211,153,0.2), rgba(5,150,105,0.15));
            border: 1px solid rgba(52,211,153,0.35);
        }

        /* Animated ring for voteable polls */
        .poll-indicator.active::before {
            content: '';
            position: absolute; inset: -3px;
            border-radius: 14px;
            background: conic-gradient(from 0deg, #6C63FF, #FF6584, #6C63FF);
            z-index: -1; opacity: 0;
            animation: spin 3s linear infinite;
            transition: opacity 0.3s;
        }
        .poll-card.can-vote:hover .poll-indicator.active::before { opacity: 1; }
        @keyframes spin { to { transform: rotate(360deg); } }

        .indicator-dot {
            width: 10px; height: 10px; border-radius: 50%;
        }
        .indicator-dot.active {
            background: linear-gradient(135deg, #a78bfa, #f472b6);
            box-shadow: 0 0 10px rgba(167,139,250,0.8);
            animation: pulse-dot 1.5s ease infinite;
        }
        @keyframes pulse-dot {
            0%,100% { transform: scale(1); box-shadow: 0 0 10px rgba(167,139,250,0.8); }
            50% { transform: scale(1.3); box-shadow: 0 0 20px rgba(167,139,250,1); }
        }
        .indicator-dot.done {
            background: #34d399;
            box-shadow: 0 0 8px rgba(52,211,153,0.7);
        }

        .poll-info { min-width: 0; }
        .poll-title {
            font-size: 0.98rem; font-weight: 700;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
            color: rgba(255,255,255,0.95);
        }
        .poll-meta {
            font-size: 0.72rem; color: rgba(255,255,255,0.35);
            margin-top: 0.3rem; display: flex; align-items: center; gap: 0.5rem;
        }
        .meta-dot { width: 3px; height: 3px; border-radius: 50%; background: rgba(255,255,255,0.2); }

        .poll-action { flex-shrink: 0; }

        .btn-vote {
            padding: 0.45rem 1.1rem; border-radius: 20px;
            font-size: 0.78rem; font-weight: 700; letter-spacing: 0.5px;
            text-transform: uppercase;
            background: linear-gradient(135deg, #6C63FF, #a78bfa);
            color: white; border: none;
            box-shadow: 0 4px 15px rgba(108,99,255,0.4);
            transition: all 0.3s ease;
            white-space: nowrap;
        }
        .poll-card.can-vote:hover .btn-vote {
            transform: scale(1.05);
            box-shadow: 0 6px 25px rgba(108,99,255,0.7);
        }

        .badge-voted {
            padding: 0.4rem 0.9rem; border-radius: 20px;
            font-size: 0.75rem; font-weight: 600;
            background: rgba(52,211,153,0.12);
            border: 1px solid rgba(52,211,153,0.35);
            color: #34d399; white-space: nowrap;
        }

        /* Vote bar */
        .vote-bar {
            position: absolute; bottom: 0; left: 0; height: 2px;
            background: linear-gradient(90deg, #6C63FF, #FF6584);
            border-radius: 0 0 20px 20px;
            transition: width 1s ease;
        }

        /* Empty state */
        .empty {
            text-align: center; padding: 5rem 2rem;
        }
        .empty-icon-wrap {
            width: 80px; height: 80px; border-radius: 24px; margin: 0 auto 1.5rem;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            display: flex; align-items: center; justify-content: center;
        }
        .empty-icon-wrap svg { width: 36px; height: 36px; opacity: 0.3; }
        .empty-text { font-size: 0.95rem; color: rgba(255,255,255,0.25); }

        /* Stats bar at top */
        .stats-bar {
            display: flex; gap: 0.75rem; margin-bottom: 2rem;
        }
        .stat-chip {
            flex: 1; padding: 0.8rem 1rem; border-radius: 14px;
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.08);
            text-align: center;
        }
        .stat-num {
            font-size: 1.4rem; font-weight: 800;
            background: linear-gradient(90deg, #a78bfa, #f472b6);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        .stat-label { font-size: 0.68rem; color: rgba(255,255,255,0.3); margin-top: 0.2rem; letter-spacing: 1px; text-transform: uppercase; }
    </style>
</head>
<body>
<div class="bg"></div>
<div class="grid-lines"></div>
<div class="particles" id="particles"></div>

<div class="page">
    <div class="header">
        <div class="logo-wrap">
            <div class="logo-icon">
                <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path d="M9 11l3 3L22 4M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/>
                </svg>
            </div>
            <div class="logo-text">VoteWidget</div>
        </div>
        <p class="subtitle">Saint-Gobain — Digital Panel Voting Service</p>
    </div>

    <!-- Stats -->
    <div class="stats-bar" th:if="${pollCount != null}">
        <div class="stat-chip">
            <div class="stat-num" th:text="${pollCount}">0</div>
            <div class="stat-label">Active Polls</div>
        </div>
        <div class="stat-chip">
            <div class="stat-num" th:text="${totalVotesCast}">0</div>
            <div class="stat-label">Total Votes</div>
        </div>
        <div class="stat-chip">
            <div class="stat-num" th:text="${votedCount}">0</div>
            <div class="stat-label">You Voted</div>
        </div>
    </div>

    <div class="divider"></div>
    <div class="section-label">Available Polls</div>

    <div class="polls-list" th:if="${pollList != null and !pollList.isEmpty()}">
        <th:block th:each="item, i : ${pollList}">
            <a th:href="${!item.voted} ? @{'/' + ${item.pollId} + '/vote'} : '#'"
               th:class="${!item.voted} ? 'poll-card can-vote' : 'poll-card voted'"
               th:style="'animation-delay:' + ${i.index * 0.1} + 's'">

                <div class="poll-left">
                    <div th:class="${!item.voted} ? 'poll-indicator active' : 'poll-indicator done'">
                        <div th:class="${!item.voted} ? 'indicator-dot active' : 'indicator-dot done'"></div>
                    </div>
                    <div class="poll-info">
                        <div class="poll-title" th:text="${item.title}"></div>
                        <div class="poll-meta">
                            <span th:text="${item.optionCount} + ' options'"></span>
                            <div class="meta-dot"></div>
                            <span th:text="${item.totalVotes} + ' votes cast'"></span>
                        </div>
                    </div>
                </div>

                <div class="poll-action">
                    <div th:if="${!item.voted}" class="btn-vote">Vote</div>
                    <div th:if="${item.voted}" class="badge-voted">Voted</div>
                </div>

                <div th:if="${item.totalVotes > 0 and item.maxVotes > 0}" class="vote-bar"
                     th:style="'width:' + ${item.barWidth} + '%'"></div>
            </a>
        </th:block>
    </div>

    <div class="empty" th:if="${pollList == null or pollList.isEmpty()}">
        <div class="empty-icon-wrap">
            <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.5">
                <rect x="3" y="3" width="18" height="18" rx="3"/>
                <path d="M9 12h6M12 9v6"/>
            </svg>
        </div>
        <p class="empty-text">No polls available yet.</p>
    </div>
</div>

<script>
    // Generate particles
    const container = document.getElementById('particles');
    const colors = ['#6C63FF','#FF6584','#43E97B','#a78bfa','#f472b6'];
    for (let i = 0; i < 25; i++) {
        const p = document.createElement('div');
        p.className = 'particle';
        const size = Math.random() * 4 + 2;
        p.style.cssText = `
            width:${size}px; height:${size}px;
            left:${Math.random()*100}%;
            background:${colors[Math.floor(Math.random()*colors.length)]};
            animation-duration:${Math.random()*15+10}s;
            animation-delay:${Math.random()*10}s;
        `;
        container.appendChild(p);
    }
</script>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8"/>
    <title>Cast Your Vote</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800;900&display=swap');
        * { margin:0; padding:0; box-sizing:border-box; }

        body {
            font-family:'Inter',sans-serif;
            background:#0a0a1a;
            min-height:100vh; color:#fff;
            display:flex; align-items:center; justify-content:center;
            padding:1.5rem;
        }

        .bg {
            position:fixed; inset:0; z-index:0;
            background: radial-gradient(ellipse at 30% 30%, #1a0533 0%, transparent 55%),
                        radial-gradient(ellipse at 70% 70%, #001a3a 0%, transparent 55%), #0a0a1a;
        }
        .grid-lines {
            position:fixed; inset:0; z-index:0;
            background-image: linear-gradient(rgba(108,99,255,0.04) 1px,transparent 1px),
                              linear-gradient(90deg,rgba(108,99,255,0.04) 1px,transparent 1px);
            background-size:60px 60px;
        }
        .particles { position:fixed; inset:0; z-index:0; overflow:hidden; }
        .particle { position:absolute; border-radius:50%; animation:rise linear infinite; opacity:0; }
        @keyframes rise { 0%{transform:translateY(100vh) scale(0);opacity:0} 10%{opacity:0.8} 90%{opacity:0.4} 100%{transform:translateY(-10vh) scale(1);opacity:0} }

        .container { position:relative; z-index:1; width:100%; max-width:500px; animation:fadeUp 0.6s ease; }
        @keyframes fadeUp { from{opacity:0;transform:translateY(30px)} to{opacity:1;transform:translateY(0)} }

        .back-link {
            display:inline-flex; align-items:center; gap:0.4rem;
            color:rgba(255,255,255,0.4); text-decoration:none; font-size:0.82rem;
            margin-bottom:1.5rem; transition:color 0.2s; letter-spacing:0.3px;
        }
        .back-link:hover { color:rgba(255,255,255,0.8); }
        .back-link svg { width:14px; height:14px; }

        .card {
            background:rgba(255,255,255,0.05);
            backdrop-filter:blur(30px);
            border:1px solid rgba(255,255,255,0.1);
            border-radius:24px; padding:2rem;
        }

        .card-header { margin-bottom:1.5rem; }

        .poll-label {
            font-size:0.65rem; font-weight:700; letter-spacing:2px;
            text-transform:uppercase;
            background:linear-gradient(90deg,#a78bfa,#f472b6);
            -webkit-background-clip:text; -webkit-text-fill-color:transparent;
            margin-bottom:0.6rem;
        }

        .poll-title {
            font-size:1.4rem; font-weight:800; line-height:1.3;
            color:rgba(255,255,255,0.95);
        }

        .divider {
            height:1px; margin:1.2rem 0;
            background:linear-gradient(90deg,transparent,rgba(108,99,255,0.3),transparent);
        }

        .alert {
            padding:0.8rem 1rem; border-radius:12px; margin-bottom:1rem;
            font-size:0.85rem; display:flex; align-items:center; gap:0.6rem;
            animation:fadeUp 0.3s ease;
        }
        .alert-dot { width:8px; height:8px; border-radius:50%; flex-shrink:0; }
        .alert-success { background:rgba(52,211,153,0.12); border:1px solid rgba(52,211,153,0.35); color:#34d399; }
        .alert-success .alert-dot { background:#34d399; box-shadow:0 0 8px #34d399; }
        .alert-warning { background:rgba(251,191,36,0.12); border:1px solid rgba(251,191,36,0.35); color:#fbbf24; }
        .alert-warning .alert-dot { background:#fbbf24; }
        .alert-error { background:rgba(255,101,132,0.12); border:1px solid rgba(255,101,132,0.35); color:#FF6584; }
        .alert-error .alert-dot { background:#FF6584; }

        .voted-banner {
            text-align:center; padding:1.5rem;
            background:linear-gradient(135deg,rgba(52,211,153,0.1),rgba(5,150,105,0.08));
            border:1px solid rgba(52,211,153,0.25); border-radius:16px; margin-bottom:1rem;
        }
        .voted-check {
            width:48px; height:48px; border-radius:50%; margin:0 auto 0.8rem;
            background:linear-gradient(135deg,#34d399,#059669);
            display:flex; align-items:center; justify-content:center;
            box-shadow:0 0 25px rgba(52,211,153,0.4);
            animation:pop 0.4s cubic-bezier(0.175,0.885,0.32,1.275);
        }
        @keyframes pop { from{transform:scale(0)} to{transform:scale(1)} }
        .voted-check svg { width:24px; height:24px; stroke:white; stroke-width:2.5; fill:none; }
        .voted-title { font-size:1rem; font-weight:700; color:#34d399; margin-bottom:0.3rem; }
        .voted-sub { font-size:0.78rem; color:rgba(255,255,255,0.35); }

        .options-grid { display:flex; flex-direction:column; gap:0.65rem; margin-bottom:1.5rem; }

        .option-label {
            display:flex; align-items:center; gap:0.9rem;
            padding:0.9rem 1.1rem;
            background:rgba(255,255,255,0.04);
            border:1px solid rgba(255,255,255,0.08);
            border-radius:14px; cursor:pointer; transition:all 0.25s ease;
            animation:slideIn 0.4s ease both;
        }
        @keyframes slideIn { from{opacity:0;transform:translateX(-8px)} to{opacity:1;transform:translateX(0)} }
        .option-label:hover {
            background:rgba(108,99,255,0.12);
            border-color:rgba(108,99,255,0.4);
            transform:translateX(4px);
        }
        .option-label.selected {
            background:rgba(108,99,255,0.18);
            border-color:#6C63FF;
            box-shadow:0 0 0 1px rgba(108,99,255,0.3), 0 8px 25px rgba(108,99,255,0.2);
        }
        .option-label input[type="radio"] { display:none; }

        .radio-outer {
            width:20px; height:20px; border-radius:50%; flex-shrink:0;
            border:2px solid rgba(255,255,255,0.2);
            display:flex; align-items:center; justify-content:center;
            transition:all 0.25s ease;
        }
        .option-label.selected .radio-outer { border-color:#6C63FF; background:rgba(108,99,255,0.3); }

        .radio-inner {
            width:8px; height:8px; border-radius:50%;
            background:linear-gradient(135deg,#a78bfa,#6C63FF);
            transform:scale(0); transition:transform 0.2s cubic-bezier(0.175,0.885,0.32,1.275);
            box-shadow:0 0 8px rgba(108,99,255,0.8);
        }
        .option-label.selected .radio-inner { transform:scale(1); }

        .option-text { font-size:0.92rem; font-weight:500; color:rgba(255,255,255,0.85); }

        .btn-submit {
            width:100%; padding:1rem; border:none; border-radius:14px;
            font-size:0.95rem; font-weight:700; letter-spacing:0.5px;
            cursor:pointer; transition:all 0.3s ease; position:relative; overflow:hidden;
            background:linear-gradient(135deg,#6C63FF,#a78bfa);
            color:#fff;
        }
        .btn-submit::before {
            content:''; position:absolute; inset:0;
            background:linear-gradient(135deg,#a78bfa,#f472b6);
            opacity:0; transition:opacity 0.3s ease;
        }
        .btn-submit:hover:not(:disabled)::before { opacity:1; }
        .btn-submit:hover:not(:disabled) { transform:translateY(-2px); box-shadow:0 10px 35px rgba(108,99,255,0.5); }
        .btn-submit:disabled { opacity:0.35; cursor:not-allowed; }
        .btn-submit span { position:relative; z-index:1; }

        .results-link {
            display:block; text-align:center; margin-top:1rem;
            font-size:0.8rem; color:rgba(255,255,255,0.3);
            text-decoration:none; transition:color 0.2s; letter-spacing:0.3px;
        }
        .results-link:hover { color:rgba(167,139,250,0.8); }

        .no-options { text-align:center; color:rgba(255,255,255,0.3); padding:1.5rem; font-size:0.88rem; }
    </style>
</head>
<body>
<div class="bg"></div>
<div class="grid-lines"></div>
<div class="particles" id="particles"></div>

<div class="container">
    <a class="back-link" th:href="'/polls'">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
        Back to polls
    </a>

    <div class="card">
        <div th:if="${successMsg != null}" class="alert alert-success">
            <div class="alert-dot"></div><span th:text="${successMsg}"></span>
        </div>
        <div th:if="${alreadyVotedMsg != null}" class="alert alert-warning">
            <div class="alert-dot"></div><span th:text="${alreadyVotedMsg}"></span>
        </div>
        <div th:if="${errorMsg != null}" class="alert alert-error">
            <div class="alert-dot"></div><span th:text="${errorMsg}"></span>
        </div>
        <div th:if="${error != null}" class="alert alert-error">
            <div class="alert-dot"></div><span th:text="${error}"></span>
        </div>

        <div th:if="${poll != null}">
            <div class="card-header">
                <div class="poll-label">Active Poll</div>
                <h1 class="poll-title" th:text="${poll.title != null ? poll.title : 'Vote Now'}"></h1>
            </div>
            <div class="divider"></div>

            <div th:if="${alreadyVoted}" class="voted-banner">
                <div class="voted-check">
                    <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>
                </div>
                <div class="voted-title">Vote Recorded</div>
                <div class="voted-sub">You have already cast your vote for this poll.</div>
            </div>

            <div th:if="${!alreadyVoted and !poll.options.isEmpty()}">
                <form th:action="'/' + ${pollId} + '/vote'" method="post" id="voteForm">
                    <div class="options-grid">
                        <label class="option-label" th:each="opt, i : ${poll.options}"
                               th:style="'animation-delay:' + ${i.index * 0.07} + 's'">
                            <input type="radio" name="optionId" th:value="${opt.id}" required onchange="selectOpt(this)"/>
                            <div class="radio-outer"><div class="radio-inner"></div></div>
                            <span class="option-text" th:text="${opt.optionText}"></span>
                        </label>
                    </div>
                    <button type="submit" class="btn-submit" id="submitBtn" disabled>
                        <span>Submit Vote</span>
                    </button>
                </form>
            </div>

            <p class="no-options" th:if="${poll.options.isEmpty()}">No options available yet.</p>
        </div>

        <a class="results-link" th:href="'/' + ${pollId}">View live results</a>
    </div>
</div>

<script>
    function selectOpt(r) {
        document.querySelectorAll('.option-label').forEach(l => l.classList.remove('selected'));
        r.closest('.option-label').classList.add('selected');
        document.getElementById('submitBtn').disabled = false;
    }
    const c = document.getElementById('particles');
    const colors = ['#6C63FF','#FF6584','#43E97B','#a78bfa','#f472b6'];
    for (let i = 0; i < 20; i++) {
        const p = document.createElement('div'); p.className = 'particle';
        const s = Math.random()*3+2;
        p.style.cssText=`width:${s}px;height:${s}px;left:${Math.random()*100}%;background:${colors[Math.floor(Math.random()*colors.length)]};animation-duration:${Math.random()*15+8}s;animation-delay:${Math.random()*10}s;`;
        c.appendChild(p);
    }
</script>
</body>
</html>
